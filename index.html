<script>

const K="inv_penjualan_v1";
let rsa=false, S, mem=null, view="dash", cart=[], carts=[cart], ci=0, sel="", edit=null, panel=null, rtab="h", dl=null, q="", qty={}, dsel=null, delId=null, fopen=true, copen=true, bsub="brg", cid=null, pend=null, pdet=false, bdet=false, impMsg="", impMsgK="";
let rsd="",rsw="",rsm="",rkq="",rsk="b",rsr=1,rct="bar",rdel=null,redit=null; // rekap harian: tanggal terpilih & jenis grafik
const $=i=>document.getElementById(i);

const tokoN=()=>String(S.sistem.toko||"").trim()||"Toko",userN=()=>String(S.sistem.user||"").trim()||"admin";

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const mon=s=>addD(s,-((pd(s).getDay()+6)%7));

/* ---- Logika bisnis: semua perubahan atomik (salin -> validasi -> terapkan -> simpan) ---- */
function tx(fn){const c=JSON.parse(JSON.stringify(S));try{fn(c);save(c);S=c;return true}catch(e){toast(e.message||"Gagal","er");return false}}

const unit=b=>b.multi?b.sk:b.sb;

const pr=id=>{const v=Number($(id).value.replace(/[^\d,]/g,"").replace(",","."));return isNaN(v)?0:v};

const fq=(id,q)=>{const b=S.brg.find(x=>x.id===+id);if(!b)return q;return b.multi?Math.floor(q/b.konv)+" "+esc(b.sb)+" "+(q%b.konv)+" "+esc(b.sk):q+" "+esc(b.sb)};
const sorted=l=>[...l].sort((a,b)=>kn(a.kat).localeCompare(kn(b.kat),"id")||a.nama.localeCompare(b.nama,"id"));
function keluar(c,id,q,d){
  const h=id+"|"+d,w=mon(d),m=id+"|"+w,y=+d.slice(0,4),mo=+d.slice(5,7),b=id+"|"+y+"|"+mo;
  (c.rh[h]=c.rh[h]||{b:id,t:d,q:0}).q+=q;
  (c.rm[m]=c.rm[m]||{b:id,t:w,e:addD(w,6),q:0}).q+=q;
  (c.rb[b]=c.rb[b]||{b:id,y,m:mo,q:0}).q+=q;
}
// Hapus/kurangi data penjualan dari rekap (harian/mingguan/bulanan): ketiganya disinkronkan, stok dikembalikan
// n = jumlah (satuan terkecil) yang dikurangi; kosong = hapus seluruh baris
function rhapus(c,scope,key,n){
  const sub=(o,k,q)=>{const x=o[k];if(!x||q<=0)return 0;const d=Math.min(q,x.q);x.q-=d;if(x.q<=0)delete o[k];return d};
  const src={h:c.rh,m:c.rm,b:c.rb}[scope],r=src[key];if(!r)throw Error("Data sudah tidak ada");
  const id=r.b,tot=r.q,full=n===undefined||n>=tot;if(full)n=tot;
  if(!(n>0))throw Error("Jumlah harus lebih dari nol");
  let from,to;
  if(scope==="h")from=to=r.t;else if(scope==="m"){from=r.t;to=r.e}else{from=r.y+"-"+pad(r.m)+"-01";to=ymd(new Date(r.y,r.m,0))}
  let left=n;
  // kurangi data harian dari tanggal terbaru lebih dulu
  const ds=Object.keys(c.rh).filter(k=>c.rh[k].b===id&&c.rh[k].t>=from&&c.rh[k].t<=to).sort((a,b)=>c.rh[b].t.localeCompare(c.rh[a].t));
  for(const k of ds){if(left<=0)break;const x=c.rh[k],d=Math.min(left,x.q);left-=d;
    const t=x.t;x.q-=d;if(x.q<=0)delete c.rh[k];
    sub(c.rm,id+"|"+mon(t),d);sub(c.rb,id+"|"+(+t.slice(0,4))+"|"+(+t.slice(5,7)),d)}
  let rem=left; // sisa dari hari yang sudah dibersihkan retensi
  if(scope==="m"){sub(c.rm,key,rem);
    let q=rem;for(const t of[from,to]){q-=sub(c.rb,id+"|"+(+t.slice(0,4))+"|"+(+t.slice(5,7)),q)}
    if(full)delete c.rm[key]}
  else if(scope==="b"){sub(c.rb,key,rem);
    const ws=Object.entries(c.rm).filter(([k,x])=>x.b===id&&x.t<=to&&x.e>=from).sort((a,b)=>(+(b[1].t>=from)-+(a[1].t>=from))||a[1].t.localeCompare(b[1].t));
    let q=rem;
    for(const[k,x]of ws){if(q<=0)break;
      const l=Object.values(c.rh).filter(h=>h.b===id&&h.t>=x.t&&h.t<=x.e).reduce((a,h)=>a+h.q,0);
      q-=sub(c.rm,k,x.q-l)}
    if(full)delete c.rb[key]}
  const b=c.brg.find(x=>x.id===id);let msg=full?"Data penjualan dihapus":"Jumlah penjualan dikurangi";
  if(b){b.stok+=n;msg+=", stok "+b.nama+" +"+fmt({...b,stok:n})+" dikembalikan"}
  return msg}
function retensi(c){const t=today(),lh=addD(t,-27),lw=addD(mon(t),-21);
  for(const k in c.rh)if(c.rh[k].t<lh)delete c.rh[k];
  for(const k in c.rm)if(c.rm[k].t<lw)delete c.rm[k];
  c.sistem.clean=t}
function tahunAktif(c){const y=new Date().getFullYear();
  if(c.sistem.tahun<y){c.rh={};c.rm={};c.rb={};c.sistem.tahun=y}} // reset tahunan: rekap dibersihkan, barang/kategori/harga/stok dipertahankan

const ICO={"dash": "<path d=\"M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10\"></path>", "jual": "<path d=\"M3 4h2l2.4 11h11l2-8H6\"></path><circle cx=\"9\" cy=\"19.5\" r=\"1.3\"></circle><circle cx=\"17\" cy=\"19.5\" r=\"1.3\"></circle>", "stok": "<path d=\"M21 8l-9-5-9 5 9 5 9-5z\"></path><path d=\"M3 8v8l9 5 9-5V8M12 13v8\"></path>", "brg": "<path d=\"M4 6h16M4 12h16M4 18h10\"></path>", "rekap": "<path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"></path>", "sis": "<circle cx=\"12\" cy=\"12\" r=\"3\"></circle><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1\"></path>"};

function jlist(){const s=q.trim().toLowerCase();
  const l=sorted(S.brg.filter(b=>b.aktif&&(!s||b.nama.toLowerCase().includes(s)||kn(b.kat).toLowerCase().includes(s))));

  +(l.map(x=>{const r=qty[x.id]||{b:0,k:0};return`<tr><td class="nm">${esc(x.nama)}</td><td class="${x.stok===0?"wn":""}">${fmt(x)}</td>${pdet?`<td>${rp(x.hj)}</td><td>${x.multi?rp(x.hje):"-"}</td>`:""}<td>${stp(x,"rb",x.sb,r.b)}</td><td>${x.multi?stp(x,"rk",x.sk,r.k):"-"}</td><td><button type="button" class="btn s p" data-a="rowAdd" data-id="${x.id}" aria-label="Tambah ke keranjang">Add</button></td></tr>`}).join("")||`<tr><td colspan="${pdet?7:5}" class="mu">${s?"Tidak ada barang yang cocok dengan pencarian.":"Belum ada barang aktif."}</td></tr>`)+`</tbody></table>`}

const F={brg:{q:"",s:"kat"},stok:{q:"",s:"kat"}};
const SORTN={kat:"Kategori A-Z",nama:"Nama A-Z",nama_d:"Nama Z-A",stok_d:"Stok terbanyak",stok_a:"Stok tersedikit",hj_d:"Harga jual tertinggi",hj_a:"Harga jual terendah"};
function vlist(k){const f=F[k],s=f.q.trim().toLowerCase();
  const n=(a,b)=>a.nama.localeCompare(b.nama,"id");
  const sb=x=>x.multi?Math.floor(x.stok/x.konv):x.stok,sk=x=>x.multi?x.stok%x.konv:0;
  const m={kat:(a,b)=>kn(a.kat).localeCompare(kn(b.kat),"id")||n(a,b),nama:n,nama_d:(a,b)=>n(b,a),stok_d:(a,b)=>sb(b)-sb(a)||sk(b)-sk(a)||n(a,b),stok_a:(a,b)=>sb(a)-sb(b)||sk(a)-sk(b)||n(a,b),hj_d:(a,b)=>b.hj-a.hj||n(a,b),hj_a:(a,b)=>a.hj-b.hj||n(a,b)};
  return S.brg.filter(b=>(!f.f||(b.aktif&&stat(b)===f.f))&&(!s||b.nama.toLowerCase().includes(s)||kn(b.kat).toLowerCase().includes(s))).sort(m[f.s]||m.kat)}
function toolbar(k){const f=F[k],o=k==="brg"?["kat","nama","nama_d","stok_d","stok_a","hj_d","hj_a"]:["kat","nama","nama_d","stok_d","stok_a"];
  return`<div class="sb">${k==="stok"?chips():""}<div class="f"><div><label>Cari</label>${srch("fq",f.q,"Nama barang atau kategori...",k)}</div>

function blist(){return`<table id="product-list-table" class="${bdet?"":"price-details-hidden"}"><thead><tr><th>Barang</th><th>Kategori</th><th>Satuan</th><th>Stok</th><th data-price-col>Harga beli</th><th data-price-col>Harga jual</th><th data-price-col>Eceran</th><th></th></tr></thead><tbody>
  ${vlist("brg").map(x=>`<tr><td class="nm${x.aktif?"":" off"}">${esc(x.nama)}</td><td>${esc(kn(x.kat))}</td><td>${x.multi?esc(x.sb)+" / "+esc(x.sk)+" ("+x.konv+")":esc(x.sb)}</td><td>${fmt(x)}</td><td data-price-col>${rp(x.hb)}</td><td data-price-col>${rp(x.hj)}</td><td data-price-col>${x.multi?rp(x.hje):"-"}</td>
  <td class="act"><button type="button" class="btn s" data-a="brgEdit" data-id="${x.id}">Ubah</button><button type="button" class="btn s" data-a="brgTog" data-id="${x.id}">${x.aktif?"Nonaktifkan":"Aktifkan"}</button>${delId===x.id?`<span class="er">Hapus permanen?</span> <button type="button" class="btn s d" data-a="brgDelOk" data-id="${x.id}">Ya, hapus</button><button type="button" class="btn s" data-a="brgDelNo">Batal</button>`:`<button type="button" class="btn s d" data-a="brgDel" data-id="${x.id}">Hapus</button>`}</td></tr>`).join("")||`<tr><td colspan="8" class="mu">${F.brg.q?"Tidak ada barang yang cocok dengan pencarian.":"Belum ada barang."}</td></tr>`}</tbody></table>`}

  ${vlist("stok").map(x=>`<tr><td class="nm">${esc(x.nama)}${x.aktif?"":' <span class="tag2 g">nonaktif</span>'}</td><td>${esc(kn(x.kat))}</td><td>${x.multi?Math.floor(x.stok/x.konv):x.stok} ${esc(x.sb)}</td><td>${x.multi?x.stok%x.konv+" "+esc(x.sk):"-"}</td><td class="${x.aktif?{habis:"er",sedikit:"wn"}[stat(x)]||"":""}"><b>${fmt(x)}</b></td>
  <td class="act"><button type="button" class="btn s" data-a="pAdd" data-id="${x.id}">+ Stok</button><button type="button" class="btn s" data-a="pKor" data-id="${x.id}">Koreksi</button></td></tr>`).join("")||`<tr><td colspan="6" class="mu">${F.stok.q||F.stok.f?"Tidak ada barang yang cocok dengan pencarian.":"Belum ada barang."}</td></tr>`}</tbody></table>`}

const sbes=b=>b.multi?Math.floor(b.stok/b.konv):b.stok;
const nb=v=>String(Math.round(v*100)/100).replace(".",",");
const batas=b=>{const a=avg(b);return a<=0?0:a<=5?1:a<=20?2:a*0.1}; // rata-rata <=5: batas 1; <=20: batas 2; selain itu 10% rata-rata
const stat=b=>b.stok===0?"habis":(avg(b)>0&&sbes(b)<=batas(b)?"sedikit":"");

const BF=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function rdef(){const t=today(),y=S.sistem.tahun;rsd=t;rsw=mon(t);rsm=String(y===+t.slice(0,4)?+t.slice(5,7):12)}
function rrows(){const o=[];
  if(rtab==="h")Object.entries(S.rh).forEach(([k,x])=>{if(x.t===rsd)o.push({k,l:tgl(x.t),b:x.b,q:x.q})});
  else if(rtab==="m")Object.entries(S.rm).forEach(([k,x])=>{if(x.t===rsw)o.push({k,l:tgl(x.t)+" – "+tgl(x.e),b:x.b,q:x.q})});
  else{const y=S.sistem.tahun;Object.entries(S.rb).forEach(([k,x])=>{if(x.y===y&&x.m===+rsm)o.push({k,l:BF[x.m-1]+" "+y,b:x.b,q:x.q})})}
  return o}
function rEditor(r){const b=S.brg.find(x=>x.id===+r.b),m=b&&b.multi,at=`data-re="1" type="number" min="0" step="1" inputmode="numeric" placeholder="0"`;

function topSc(){const a=$("tsb"),v=$("vl"),i=$("tsbi");if(!a||!v||!i)return;const tb=v.firstElementChild;i.style.width=(tb?tb.scrollWidth:0)+"px";a.hidden=!(tb&&tb.scrollWidth>v.clientWidth+1);if(!a._b){a._b=1;let l=0;a.addEventListener("scroll",()=>{if(l)return;l=1;$("vl").scrollLeft=a.scrollLeft;l=0});v.addEventListener("scroll",()=>{if(l)return;l=1;a.scrollLeft=v.scrollLeft;l=0})}a.scrollLeft=v.scrollLeft}

function okBackup(o){const bad="Isi file tidak sesuai format cadangan aplikasi ini";
  if(!o||typeof o!=="object"||!Array.isArray(o.kat)||!Array.isArray(o.brg)||!o.sistem||!Number.isInteger(o.sistem.tahun)||!Number.isInteger(o.seq))return bad;
  for(const k of["rh","rm","rb"])if(!o[k]||typeof o[k]!=="object"||Array.isArray(o[k]))return bad;
  const ids=new Set(),bi=new Set();
  for(const k of o.kat){if(!k||!Number.isInteger(k.id)||typeof k.n!=="string"||ids.has(k.id))return bad;ids.add(k.id)}
  for(const b of o.brg){if(!b||!Number.isInteger(b.id)||bi.has(b.id)||typeof b.nama!=="string"||typeof b.sb!=="string"||!ids.has(b.kat)||!Number.isInteger(b.stok)||b.stok<0||!Number.isInteger(b.konv)||b.konv<1||typeof b.multi!=="boolean")return bad;bi.add(b.id)}
  if([...ids,...bi].some(x=>x>=o.seq))return "Isi file tidak konsisten (nomor urut)";
  return ""}

/* Kunci koreksi stok: stok baru tidak boleh melebihi stok saat ini */
function clampKor(){if(!panel||panel.m!=="kor")return;const b=S.brg.find(x=>x.id===panel.id),ib=$("kb"),ik=$("kk");if(!b||!ib)return;
  let nb=Math.floor(Number(ib.value)||0),nk=ik?Math.floor(Number(ik.value)||0):0,ch=false;
  const mx=b.multi?Math.floor(b.stok/b.konv):b.stok;
  if(nb>mx){nb=mx;ch=true}
  if(b.multi){const cap=Math.min(b.stok-nb*b.konv,b.konv-1);if(nk>cap){nk=cap;ch=true}}
  if(ch){ib.value=nb;if(ik)ik.value=nk;toast("Stok baru tidak boleh melebihi stok saat ini ("+fmt(b)+")")}}
/* Kunci jumlah penjualan: total (besar x konversi + kecil) tidak boleh melebihi stok saat ini */
function capQ(b,f,r,other){const av=Math.max(0,b.stok-(other||0));
  if(f==="b")return b.multi?Math.floor(Math.max(0,av-(Number(r.k)||0))/b.konv):av;
  return Math.max(0,av-(Number(r.b)||0)*kv(b))}
function lockQty(b,f,r,other,inp){if(!b)return false;const cap=capQ(b,f,r,other);
  if(Number(r[f])>cap){r[f]=cap;if(inp)inp.value=cap;toast("Jumlah "+b.nama+" tidak boleh melebihi stok saat ini ("+fmt(b)+")");return true}return false}
function cartOther(it){return cart.reduce((n,c)=>{if(c===it||c.id!==it.id)return n;const b=S.brg.find(x=>x.id===c.id);return n+(b?(c.b||0)*kv(b)+(b.multi?(c.k||0):0):0)},0)}

  if(r.error){sbErr("Gagal memuat dari Supabase",r.error);return}
  const d=r.data;
  if(d&&d.data&&d.data.brg&&d.data.sistem){const t=new Date(d.updated_at).getTime();if(t===sbAt)return;
    S=d.data;sbAt=t;mem=JSON.stringify(S);try{localStorage.setItem(K,mem)}catch(e){}
    if(S.sistem.clean!==today())tx(c=>retensi(c));render()}
  else if(first)sbPush()} // belum ada data di server: unggah data dari browser ini
function sbLogin(msg){let o=$("sbl");if(!o){o=document.createElement("div");o.id="sbl";o.style.cssText="position:fixed;inset:0;z-index:50;background:#edf2f6;display:flex;align-items:center;justify-content:center;padding:16px";document.body.appendChild(o)}
  o.innerHTML=`<form id="sbf" style="background:#fff;border:1px solid #e0e8ef;border-radius:14px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;color:#142b43;font:14px Inter,sans-serif"><b style="font-size:16px">Masuk</b><input class="in" id="sbe" type="email" placeholder="Email" autocomplete="username" required><input class="in" id="sbp" type="password" placeholder="Kata sandi" autocomplete="current-password" required><button class="btn p" type="submit">Masuk</button><div id="sbm" style="color:#c24d4d;font-size:12px;min-height:14px">${esc(msg||"")}</div></form>`;
  $("sbf").onsubmit=async e=>{e.preventDefault();$("sbm").textContent="";
    const r=await SB.auth.signInWithPassword({email:$("sbe").value.trim(),password:$("sbp").value});
    if(r.error){$("sbm").textContent="Email atau kata sandi salah";return}
    sbU=r.data.user;o.remove();sbPull(true)}}
S=load();
S.brg.forEach(b=>{if(!b.mk){b.mk=b.nm>0&&b.masuk!==undefined?[b.masuk/b.nm/kv(b)]:(b.stok>0?[b.stok/kv(b)]:[]);delete b.masuk;delete b.nm}});
if(S.sistem.clean!==today())tx(c=>retensi(c));
try{if(window.claude&&claude.use)claude.use("downloads").then(x=>{dl=x;if(view==="sis")render()}).catch(()=>{})}catch(e){}
render();
if(SB){sbLogin();
  SB.auth.getSession().then(({data})=>{if(data&&data.session){sbU=data.session.user;const o=$("sbl");if(o)o.remove();sbPull(true)}});
  SB.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){sbU=null;sbAt=0;sbLogin()}});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)sbPull()})}
</script>

</body></html>
